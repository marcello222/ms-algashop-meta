# Disable global init scripts (bypass Develocity plugin applied via ~/.gradle/init.d)
systemProp.org.gradle.ignoreInitScripts=true

# Ensure this project is not in offline mode
org.gradle.offline=false

# Fix encoding issues with special characters in path
systemProp.file.encoding=UTF-8
org.gradle.jvmargs=-Dfile.encoding=UTF-8
